name: Deploy to Hostinger

# Baut die Produktionsfassung (Domain www.pospurtal.de, Pfade ab /) und laedt
# sie per FTPS zu Hostinger. Damit kann der falsche Build gar nicht mehr live
# gehen: Der Upload passiert nur, wenn Typpruefung und Build sauber sind.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typen pruefen
        run: npm run check

      - name: Bauen (Produktion)
        run: npm run build:prod

      - name: Hinweis, solange die Zugangsdaten fehlen
        if: ${{ secrets.FTP_SERVER == '' }}
        run: echo "::warning::FTP-Zugangsdaten fehlen (Secrets FTP_SERVER/FTP_USERNAME/FTP_PASSWORD). Es wurde nichts hochgeladen."

      - name: Per FTPS zu Hostinger hochladen
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          # Laedt nur geaenderte Dateien hoch; der Zustand liegt in
          # .ftp-deploy-sync-state.json auf dem Server.
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
